<!DOCTYPE html>
<html lang="vi"><head><meta charset="utf-8">
<link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#c8102e"><link rel="apple-touch-icon" href="icon-192.png">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Shogo Task – Quản lý công việc</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f4f6f9;--card:#fff;--tx:#1b2430;--mu:#6b7686;--bd:#dde3ea;--pr:#c8102e;--ok:#1f9d55;--wa:#e08a00}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12161c;--card:#1c222b;--tx:#e8edf3;--mu:#93a0b2;--bd:#2c3441}}
:root[data-theme="dark"]{--bg:#12161c;--card:#1c222b;--tx:#e8edf3;--mu:#93a0b2;--bd:#2c3441}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:10px 14px;background:var(--card);border-bottom:1px solid var(--bd);position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
h1{font-size:17px;margin:0 8px 0 0;color:var(--pr)}
nav button,.btn,select,input,textarea{font:inherit;color:var(--tx);background:var(--card);border:1px solid var(--bd);border-radius:7px;padding:6px 10px}
nav button.on{background:var(--pr);color:#fff;border-color:var(--pr)}
.btn.pr{background:var(--pr);color:#fff;border-color:var(--pr);cursor:pointer}button{cursor:pointer}
.sp{flex:1}main{padding:14px}
.board{display:grid;grid-template-columns:repeat(4,minmax(220px,1fr));gap:12px;overflow-x:auto}
.col{background:var(--bg);border:1px solid var(--bd);border-radius:10px;padding:8px;min-height:200px}
.col h3{font-size:13px;margin:2px 4px 8px;display:flex;justify-content:space-between}
.col.over{outline:2px dashed var(--pr)}
.t{background:var(--card);border:1px solid var(--bd);border-left:4px solid var(--mu);border-radius:8px;padding:8px 10px;margin-bottom:8px;cursor:grab}
.t.high{border-left-color:var(--pr)}.t.med{border-left-color:var(--wa)}.t.low{border-left-color:var(--ok)}
.t b{display:block;margin-bottom:3px}.m{color:var(--mu);font-size:12px}.late{color:var(--pr);font-weight:600}
.tag{display:inline-block;font-size:11px;padding:1px 7px;border-radius:99px;background:var(--bg);border:1px solid var(--bd);margin-right:4px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:14px}
.k{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:12px}.k big{font-size:26px;font-weight:700;display:block}
.panel{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:12px;margin-bottom:14px}
.bar{height:8px;background:var(--bg);border-radius:9px;overflow:hidden;margin:3px 0 9px}.bar i{display:block;height:100%;background:var(--ok)}
.tw{overflow-x:auto}table{width:100%;border-collapse:collapse;background:var(--card)}th,td{padding:8px;border-bottom:1px solid var(--bd);text-align:left;white-space:nowrap}
dialog{border:1px solid var(--bd);border-radius:12px;background:var(--card);color:var(--tx);width:min(480px,94vw)}
dialog label{display:block;margin-top:8px;font-size:12px;color:var(--mu)}dialog input,dialog select,dialog textarea{width:100%}
@media(max-width:800px){.board{grid-template-columns:repeat(4,80vw)}}
body.busy::before{content:"";position:fixed;top:0;left:0;right:0;height:3px;background:var(--pr);z-index:100;animation:ld 1s infinite}@keyframes ld{50%{opacity:.2}}
</style><script src="https://accounts.google.com/gsi/client" async defer onload="window.gisReady=1;window.gisInit&&gisInit()"></script></head><body>
<div id="lg" style="display:none;position:fixed;inset:0;background:var(--bg);z-index:99;align-items:center;justify-content:center;flex-direction:column;gap:14px"><h1 style="font-size:26px">SHOGO Task</h1><div class="m">Đăng nhập bằng Gmail đã được quản trị cấp quyền</div><div id="gbtn"></div></div>
<header><h1>SHOGO Task</h1>
<nav><button data-v="board" class="on">Kanban</button> <button data-v="list">Danh sách</button> <button data-v="dash">Tổng quan</button> <button data-v="users" id="nu" style="display:none">Nhân sự</button></nav>
<span class="sp"></span>
<input id="q" placeholder="Tìm kiếm..." style="width:140px">
<select id="fd"></select><select id="fa"></select>
<select id="so"><option value="due">Xếp: Hạn gần</option><option value="pri">Xếp: Ưu tiên</option><option value="upd">Xếp: Mới cập nhật</option></select> <span id="who" class="m"></span> <button class="btn" id="out">Thoát</button> <button class="btn pr" id="add">+ Giao việc</button></header>
<div id="chips" style="padding:10px 14px 0;display:flex;gap:6px;flex-wrap:wrap"></div>
<main id="app"></main>
<dialog id="dlg"><h3 id="dt" style="margin:0 0 4px">Công việc</h3>
<label>Tiêu đề<input id="f_t"></label>
<label>Mô tả<textarea id="f_d" rows="3"></textarea></label>
<label>Phòng ban<select id="f_dep"></select></label>
<label>Người thực hiện<select id="f_a"></select></label>
<label>Ưu tiên<select id="f_p"><option value="high">Cao</option><option value="med">Trung bình</option><option value="low">Thấp</option></select></label>
<label>Hạn hoàn thành<input type="date" id="f_due"></label>
<label>Tiến độ (%)<input type="number" min="0" max="100" id="f_pg"></label>
<label>Trạng thái<select id="f_s"></select></label>
<label>Checklist (việc con)</label><div id="sub_l"></div><div style="display:flex;gap:6px;margin-top:4px"><input id="sub_i" placeholder="Thêm việc con..."><button class="btn" id="sub_a" type="button">+</button></div>
<div id="cm_w"><label>Bình luận</label><div id="cm_l" class="m" style="max-height:130px;overflow:auto"></div><div style="display:flex;gap:6px;margin-top:4px"><input id="cm_i" placeholder="Viết bình luận..."><button class="btn" id="cm_a" type="button">Gửi</button></div></div>
<div id="act" style="margin-top:12px"></div>
<div class="m" id="meta" style="margin-top:8px"></div>
<div style="display:flex;gap:8px;margin-top:14px"><button class="btn" id="del" style="color:var(--pr)">Xóa</button><span class="sp"></span><button class="btn" id="cx">Hủy</button><button class="btn pr" id="ok">Lưu</button></div></dialog>
<dialog id="csvd"><h3 style="margin:0">Xuất bảng công việc</h3><p class="m">Bấm "Sao chép" rồi dán (Ctrl+V) vào Excel hoặc Google Sheets.</p><textarea id="csvt" rows="10" readonly></textarea><div style="display:flex;gap:8px;margin-top:10px"><span class="sp"></span><button class="btn" id="csvc">Sao chép</button><button class="btn pr" id="csvx">Đóng</button></div></dialog>
<script>
const ST=[["todo","Cần làm"],["doing","Đang làm"],["review","Chờ duyệt"],["done","Hoàn thành"]];
const PR={high:"Cao",med:"TB",low:"Thấp"};
const DEP=["Kinh doanh","Thiết kế – Kỹ thuật","Sản xuất","Kho – Logistics","QC – Chất lượng","Mua hàng","Kế toán","HCNS"];
let PPL=[],ME={role:"staff"};
const day=n=>{const d=new Date(Date.now()+n*864e5);return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")};
let QF="",SHEET="",SUB=[],S=null,V="board",editId=null;
const $=s=>document.querySelector(s);
function boot(){GAS.run.withSuccessHandler(d=>{S=d.tasks;ME=d.me;PPL=d.people;SHEET=d.url;const v=$("#fa").value,nm=PPL.map(p=>p[0]);fill($("#fa"),nm,"Tất cả nhân sự");$("#fa").value=v;fill($("#f_a"),nm);$("#who").textContent=ME.name+" · "+ME.role;$("#add").style.display=ME.role==="staff"?"none":"";$("#nu").style.display=["owner","admin"].includes(ME.role)?"":"none";render()}).withFailureHandler(e=>{$("#app").innerHTML='<div class="panel late">'+esc(e.message||e)+'</div>'}).bootstrap()}
function save(t){GAS.run.withSuccessHandler(boot).withFailureHandler(e=>{alert(e.message||e);boot()}).saveTask(t)}
const late=t=>t.s!=="done"&&t.due&&t.due<day(0);
const fill=(el,arr,all)=>el.innerHTML=(all?`<option value="">${all}</option>`:"")+arr.map(x=>`<option>${esc(x)}</option>`).join("");
const J=s=>{try{return JSON.parse(s||"[]")}catch(e){return[]}};
const canAp=t=>t.by===ME.email||(ME.role==="owner"&&t.byName===t.by);
const PO={high:0,med:1,low:2};
const QFN=t=>!QF||(QF==="me"&&t.a===ME.name)||(QF==="late"&&late(t))||(QF==="appr"&&t.s==="review"&&canAp(t))||(QF==="week"&&t.s!=="done"&&t.due&&t.due<=day(7));
function filt(){const q=$("#q").value.toLowerCase(),d=$("#fd").value,a=$("#fa").value,so=$("#so").value;
return S.filter(t=>(!q||(t.t+t.d).toLowerCase().includes(q))&&(!d||t.dep===d)&&(!a||t.a===a)&&QFN(t)).sort((x,y)=>so==="pri"?PO[x.p]-PO[y.p]||(x.due||"z").localeCompare(y.due||"z"):so==="upd"?String(y.updated).localeCompare(String(x.updated)):(x.due||"z").localeCompare(y.due||"z"))}
function chips(){const C=[["","Tất cả",S.length],["me","Việc của tôi",S.filter(t=>t.a===ME.name&&t.s!=="done").length],["appr","Chờ tôi duyệt",S.filter(t=>t.s==="review"&&canAp(t)).length],["late","Trễ hạn",S.filter(late).length],["week","Hạn ≤ 7 ngày",S.filter(t=>t.s!=="done"&&t.due&&t.due<=day(7)).length]];
$("#chips").innerHTML=C.map(c=>`<button class="btn" data-q="${c[0]}" style="${QF===c[0]?"background:var(--pr);color:#fff;border-color:var(--pr)":""}">${c[1]} (${c[2]})</button>`).join("");
document.querySelectorAll("#chips button").forEach(b=>b.onclick=()=>{QF=b.dataset.q;render()})}
const esc=s=>String(s||"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const card=t=>`<div class="t ${t.p}" draggable="true" data-id="${t.id}"><button class="btn adv" data-id="${t.id}" title="Chuyển sang bước tiếp theo" style="padding:0 8px;float:right">›</button><b>${esc(t.t)}</b><span class="tag">${esc(t.dep)}</span><span class="tag">${PR[t.p]}</span><div class="m">👤 ${esc(t.a)} · <span class="${late(t)?"late":""}">📅 ${esc(t.due)||"—"}${late(t)?" (trễ hạn)":""}</span> <span>${J(t.sub).length?"☑ "+J(t.sub).filter(s=>s.d).length+"/"+J(t.sub).length:""} ${J(t.cmt).length?"💬 "+J(t.cmt).length:""}</span></div>${t.s==="review"?`<div class="m" style="color:var(--wa);font-weight:600">${canAp(t)?"👉 Cần bạn duyệt":"⏳ Chờ "+esc(t.byName||t.by)+" duyệt"}</div>`:""}<div class="bar"><i style="width:${t.pg}%"></i></div></div>`;
function render(){chips();$("#chips").style.display=V==="users"?"none":"flex";const L=filt(),A=$("#app");if(V==="users"){usersV();return}
if(V==="board"){A.innerHTML=`<div class="board">${ST.map(([k,n])=>{const x=L.filter(t=>t.s===k);return`<div class="col" data-s="${k}"><h3>${n}<span class="m">${x.length}</span></h3>${x.map(card).join("")}</div>`}).join("")}</div>`;bindDnD()}
else if(V==="list"){A.innerHTML=`<div class="tw"><table><tr><th>Công việc</th><th>Phòng ban</th><th>Người làm</th><th>Ưu tiên</th><th>Hạn</th><th>Tiến độ</th><th>Trạng thái</th></tr>${L.map(t=>`<tr class="row" data-id="${t.id}" style="cursor:pointer"><td>${esc(t.t)}</td><td>${esc(t.dep)}</td><td>${esc(t.a)}</td><td>${PR[t.p]}</td><td class="${late(t)?"late":""}">${esc(t.due)||"—"}</td><td>${t.pg}%</td><td>${ST.find(s=>s[0]===t.s)[1]}</td></tr>`).join("")}</table></div>`}
else{const done=L.filter(t=>t.s==="done").length,lt=L.filter(late),avg=L.length?Math.round(L.reduce((a,t)=>a+t.pg,0)/L.length):0;
const by=(arr,f)=>arr.map(n=>{const x=L.filter(t=>f(t)===n);if(!x.length)return"";const p=Math.round(x.reduce((a,t)=>a+t.pg,0)/x.length);return`<div>${esc(n)} <span class="m">(${x.length} việc · ${x.filter(late).length} trễ)</span></div><div class="bar"><i style="width:${p}%"></i></div>`}).join("");
A.innerHTML=`<div class="grid"><div class="k">Tổng công việc<big>${L.length}</big></div><div class="k">Hoàn thành<big style="color:var(--ok)">${done}</big></div><div class="k">Chờ duyệt<big style="color:var(--wa)">${L.filter(t=>t.s==="review").length}</big></div><div class="k">Trễ hạn<big style="color:var(--pr)">${lt.length}</big></div><div class="k">Tiến độ TB<big>${avg}%</big></div></div>
<div class="panel"><b>Theo phòng ban</b><div style="margin-top:8px">${by(DEP,t=>t.dep)}</div></div>
<div class="panel"><b>Khối lượng theo nhân sự</b><div style="margin-top:8px">${by(PPL.map(p=>p[0]),t=>t.a)}</div></div>
<div class="panel"><b>Việc trễ hạn</b>${lt.length?lt.map(t=>`<div class="row" data-id="${t.id}" style="cursor:pointer;padding:5px 0">⚠ ${esc(t.t)} <span class="m">– ${esc(t.a)}, hạn ${t.due}</span></div>`).join(""):'<div class="m">Không có 🎉</div>'}</div>
<button class="btn" id="exp">Xuất bảng (dán vào Excel/Sheets)</button> ${SHEET?`<a class="btn" target="_blank" href="${SHEET}" style="text-decoration:none">Mở Google Sheet</a>`:""} ${["admin","owner"].includes(ME.role)&&!S.length?`<button class="btn pr" id="seed">Nạp dữ liệu mẫu</button>`:""}`;
const e=$("#exp");if(e)e.onclick=exportCSV;const sd=$("#seed");if(sd)sd.onclick=()=>GAS.run.withSuccessHandler(boot).withFailureHandler(x=>alert(x.message||x)).seedDemo()}
document.querySelectorAll(".t,.row").forEach(el=>el.onclick=()=>openD(+el.dataset.id));document.querySelectorAll(".adv").forEach(b=>b.onclick=e=>{e.stopPropagation();const t=S.find(x=>x.id==b.dataset.id),i=ST.findIndex(z=>z[0]===t.s);moveTo(t,ST[(i+1)%4][0])})}
function moveTo(t,ns){if(ns===t.s)return;const ap=canAp(t),nmz=t.byName||t.by;
if(ns==="done"&&!ap)return alert("Chỉ người giao việc ("+nmz+") mới được duyệt hoàn thành.");
if(t.s==="done"&&!ap)return alert("Việc đã hoàn thành, chỉ người giao ("+nmz+") mới được mở lại.");
const rr=()=>GAS.run.withSuccessHandler(boot).withFailureHandler(e=>{alert(e.message||e);boot()});
if(ns==="done")return rr().approveTask(t.id,true,"");
if(ns==="review"&&t.a===ME.name)return rr().submitTask(t.id);
if(t.s==="review"&&ap&&ns!=="done")return openD(t.id)
t.s=ns;save(t);render()}
function actR(t){const A=$("#act"),g=i=>document.getElementById(i);A.innerHTML="";if(!t)return;const ap=canAp(t);
if(t.a===ME.name&&(t.s==="todo"||t.s==="doing"))A.innerHTML='<button class="btn pr" id="a_sub" type="button" style="width:100%">✅ Tôi đã hoàn thành – gửi người giao duyệt</button>';
else if(t.s==="review"&&ap)A.innerHTML='<div class="m" style="margin-bottom:4px">'+esc(t.a)+' báo đã hoàn thành. Bạn là người giao việc nên cần duyệt:</div><input id="a_n" placeholder="Ghi chú (bắt buộc nếu trả lại)"><div style="display:flex;gap:8px;margin-top:6px"><button class="btn pr" id="a_ok" type="button">✔ Duyệt hoàn thành</button><button class="btn" id="a_no" type="button">↩ Trả lại</button></div>';
else if(t.s==="review")A.innerHTML='<div class="m">⏳ Đang chờ '+esc(t.byName||t.by)+' duyệt (chỉ người giao việc mới duyệt được).</div>';
const go=()=>GAS.run.withSuccessHandler(()=>{$("#dlg").close();boot()}).withFailureHandler(e=>alert(e.message||e));
if(g("a_sub"))g("a_sub").onclick=()=>go().submitTask(t.id);
if(g("a_ok"))g("a_ok").onclick=()=>go().approveTask(t.id,true,g("a_n").value);
if(g("a_no"))g("a_no").onclick=()=>{if(!g("a_n").value.trim())return alert("Vui lòng ghi lý do trả lại.");go().approveTask(t.id,false,g("a_n").value)}}
function bindDnD(){document.querySelectorAll(".t").forEach(el=>el.ondragstart=e=>e.dataTransfer.setData("id",el.dataset.id));
document.querySelectorAll(".col").forEach(c=>{c.ondragover=e=>{e.preventDefault();c.classList.add("over")};c.ondragleave=()=>c.classList.remove("over");
c.ondrop=e=>{e.preventDefault();const t=S.find(x=>x.id==e.dataTransfer.getData("id"));if(t)moveTo(t,c.dataset.s)}})}
function openD(id){editId=id;const t=id?S.find(x=>x.id===id):{t:"",d:"",dep:DEP[0],a:PPL[0][0],p:"med",due:day(7),s:"todo",pg:0};
$("#dt").textContent=id?"Sửa công việc":"Giao việc mới";const st=ME.role==="staff";["f_t","f_d","f_dep","f_a","f_p","f_due"].forEach(i=>$("#"+i).disabled=st);$("#del").dataset.c="";$("#del").textContent="Xóa";$("#del").style.display=id&&ME.role==="owner"?"":"none";
$("#f_t").value=t.t;$("#f_d").value=t.d;$("#f_dep").value=t.dep;$("#f_a").value=t.a;$("#f_p").value=t.p;$("#f_due").value=t.due;$("#f_pg").value=t.pg;$("#f_s").value=t.s;Array.from($("#f_s").options).forEach(o=>o.disabled=(o.value==="done"&&!canAp(t))||(o.value==="review"&&t.a===ME.name&&t.s!=="review"));$("#f_s").disabled=(t.s==="done"&&!canAp(t));actR(id?t:null);SUB=J(t.sub);subR();cmR(t);$("#cm_w").style.display=id?"":"none";$("#meta").textContent=t.by?"Giao bởi "+t.by+" · cập nhật "+String(t.updated||"").slice(0,16).replace("T"," "):"";$("#dlg").showModal()}
let UL=[];
function usersV(){GAS.run.withSuccessHandler(l=>{UL=l;usersR()}).withFailureHandler(e=>{$("#app").innerHTML='<div class="panel late">'+esc(e.message||e)+'</div>'}).listUsers()}
function usersR(){const own=ME.role==="owner",roles=own?["admin","manager","staff"]:["manager","staff"];
$("#app").innerHTML=`<div class="panel"><b>Thêm / sửa nhân sự</b><div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin-top:8px"><input id="u_e" placeholder="Email"><input id="u_n" placeholder="Họ tên (không đổi được sau khi tạo)"><select id="u_d">${DEP.map(d=>`<option>${d}</option>`).join("")}</select><select id="u_r">${roles.map(x=>`<option>${x}</option>`).join("")}</select><button class="btn pr" id="u_s">Lưu</button></div><div class="m" style="margin-top:6px">Chỉ email có trong danh sách này mới xem được app. admin: giao/sửa mọi việc, quản lý nhân sự, KHÔNG xóa việc. Chỉ chủ sở hữu mới cấp quyền admin và xóa việc.</div></div><div class="tw"><table><tr><th>Email</th><th>Họ tên</th><th>Phòng ban</th><th>Vai trò</th><th></th></tr>${UL.map((u,i)=>`<tr><td>${esc(u.email)}</td><td>${esc(u.name)}</td><td>${esc(u.dep)}</td><td>${esc(u.role)}</td><td><button class="btn" data-i="${i}" data-a="e">Sửa</button> <button class="btn" data-i="${i}" data-a="d">Xóa</button></td></tr>`).join("")}</table></div>`;
const fail=e=>alert(e.message||e);
$("#u_s").onclick=()=>GAS.run.withSuccessHandler(boot).withFailureHandler(fail).saveUser({email:$("#u_e").value,name:$("#u_n").value,dep:$("#u_d").value,role:$("#u_r").value});
document.querySelectorAll("#app [data-a]").forEach(b=>b.onclick=()=>{const u=UL[+b.dataset.i];
if(b.dataset.a==="e"){$("#u_e").value=u.email;$("#u_e").readOnly=true;$("#u_n").value=u.name;$("#u_n").readOnly=true;$("#u_d").value=u.dep;if(roles.includes(u.role))$("#u_r").value=u.role;window.scrollTo(0,0)}
else if(b.dataset.c!=="1"){b.dataset.c="1";b.textContent="Bấm lần nữa"}else GAS.run.withSuccessHandler(boot).withFailureHandler(fail).deleteUser(u.email)})}
function subR(){$("#sub_l").innerHTML=SUB.map((x,i)=>`<div><label style="display:flex;gap:6px;align-items:center;margin:2px 0;color:var(--tx)"><input type="checkbox" style="width:auto" data-i="${i}" ${x.d?"checked":""}> <span style="${x.d?"text-decoration:line-through;color:var(--mu)":""}">${esc(x.x)}</span></label></div>`).join("");
