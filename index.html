<script>
const ST=[["todo","Cần làm"],["doing","Đang làm"],["review","Chờ duyệt"],["done","Hoàn thành"]];
const PR={high:"Cao",med:"TB",low:"Thấp"};
const DEP=["Kinh doanh","Thiết kế – Kỹ thuật","Sản xuất","Kho – Logistics","QC – Chất lượng","Mua hàng","Kế toán","HCNS"];
let PPL=[],ME={role:"staff"};
const day=n=>{const d=new Date(Date.now()+n*864e5);return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")};
let QF="",SHEET="",SUB=[],S=null,V="board",editId=null;
const $=s=>document.querySelector(s);
function boot(){GAS.run.withSuccessHandler(d=>{S=d.tasks;ME=d.me;PPL=d.people;SHEET=d.url;const v=$("#fa").value,nm=PPL.map(p=>p[0]);fill($("#fa"),nm,"Tất cả nhân sự");$("#fa").value=v;fill($("#f_a"),nm);$("#who").textContent=ME.name+" · "+ME.role;$("#add").style.display=ME.role==="staff"?"none":"";$("#nu").style.display=["owner","admin"].includes(ME.role)?"":"none";render();hello()}).withFailureHandler(e=>{$("#app").innerHTML='<div class="panel late">'+esc(e.message||e)+'</div>'}).bootstrap()}
const BUSY=new Set();let NB=0;
const upsert=t=>{if(!t)return;const i=S.findIndex(x=>x.id==t.id);if(i<0)S.push(t);else S[i]=t};
function save(t,snap){const k="s"+t.id;if(BUSY.has(k))return;BUSY.add(k);
GAS.run.withSuccessHandler(r=>{BUSY.delete(k);r?upsert(r):boot();render();hello()}).withFailureHandler(e=>{BUSY.delete(k);toast(e.message||e);if(snap)upsert(snap);render();boot()}).saveTask(t)}
function act(t,fn,...a){const k="a"+t.id;if(BUSY.has(k))return;BUSY.add(k);document.querySelectorAll('[data-id="'+t.id+'"]').forEach(e=>e.classList.add("pend"));
GAS.run.withSuccessHandler(r=>{BUSY.delete(k);upsert(r);if($("#dlg").open)$("#dlg").close();render();hello()}).withFailureHandler(e=>{BUSY.delete(k);toast(e.message||e);render()})[fn](t.id,...a)}
const late=t=>t.s!=="done"&&t.due&&t.due<day(0);
const fill=(el,arr,all)=>el.innerHTML=(all?`<option value="">${all}</option>`:"")+arr.map(x=>`<option>${esc(x)}</option>`).join("");
const J=s=>{try{return JSON.parse(s||"[]")}catch(e){return[]}};
const canAp=t=>t.by===ME.email||(ME.role==="owner"&&t.byName===t.by);
const PO={high:0,med:1,low:2};
const QFN=t=>!QF||(QF==="me"&&t.a===ME.name)||(QF==="late"&&late(t))||(QF==="appr"&&t.s==="review"&&canAp(t))||(QF==="week"&&t.s!=="done"&&t.due&&t.due<=day(7));
function filt(){const q=$("#q").value.toLowerCase(),d=$("#fd").value,a=$("#fa").value,so=$("#so").value;
return S.filter(t=>(!q||(t.t+t.d).toLowerCase().includes(q))&&(!d||t.dep===d)&&(!a||t.a===a)&&QFN(t)).sort((x,y)=>so==="pri"?PO[x.p]-PO[y.p]||(x.due||"z").localeCompare(y.due||"z"):so==="upd"?String(y.updated).localeCompare(String(x.updated)):(x.due||"z").localeCompare(y.due||"z"))}
function chips(){const C=[["","Tất cả",S.length],["me","Việc của tôi",S.filter(t=>t.a===ME.name&&t.s!=="done").length],["appr","Chờ tôi duyệt",S.filter(t=>t.s==="review"&&canAp(t)).length],["late","Trễ hạn",S.filter(late).length],["week","Hạn ≤ 7 ngày",S.filter(t=>t.s!=="done"&&t.due&&t.due<=day(7)).length]];
$("#chips").innerHTML=C.map(c=>`<button class="btn" data-q="${c[0]}" style="${QF===c[0]?"background:var(--pr);color:#fff;border-color:var(--pr)":""}">${c[1]} (${c[2]})</button>`).join("");
document.querySelectorAll("#chips button").forEach(b=>b.onclick=()=>{QF=b.dataset.q;render()})}
const esc=s=>String(s||"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const NX=t=>t.s==="todo"||(t.s==="doing"&&t.a===ME.name)||(t.s==="review"&&canAp(t));
const card=t=>`<div class="t ${t.p}" draggable="true" data-id="${t.id}">${NX(t)?`<button class="btn adv" data-id="${t.id}" title="${t.s==="review"?"Duyệt hoàn thành":t.s==="doing"?"Gửi người giao duyệt":"Bắt đầu làm"}" style="padding:0 8px;float:right">›</button>`:""}<b>${esc(t.t)}</b><span class="tag">${esc(t.dep)}</span><span class="tag">${PR[t.p]}</span><div class="m">${ic.u}${esc(t.a)} · <span class="${late(t)?"late":""}">${ic.c}${esc(t.due)||"—"}${late(t)?" (trễ hạn)":""}</span> <span>${J(t.sub).length?"☑ "+J(t.sub).filter(s=>s.d).length+"/"+J(t.sub).length:""} ${J(t.cmt).length?ic.m+J(t.cmt).length:""}</span></div>${t.s==="review"?`<div class="m" style="color:var(--wa);font-weight:600">${canAp(t)?"👉 Cần bạn duyệt":"⏳ Chờ "+esc(t.byName||t.by)+" duyệt"}</div>`:""}<div class="bar"><i style="width:${t.pg}%"></i></div></div>`;
function render(){if(!S)return;chips();$("#chips").style.display=$("#tb").style.display=V==="users"?"none":"flex";const L=filt(),A=$("#app");if(V==="users"){usersV();return}
if(V==="board"){A.innerHTML=`<div class="board">${ST.map(([k,n])=>{const x=L.filter(t=>t.s===k);return`<div class="col" data-s="${k}"><h3>${n}<span class="m">${x.length}</span></h3>${x.map(card).join("")||'<div class="e">Chưa có việc</div>'}</div>`}).join("")}</div>`;bindDnD()}
else if(V==="list"){A.innerHTML=`<div class="tw"><table><tr><th>Công việc</th><th>Phòng ban</th><th>Người làm</th><th>Ưu tiên</th><th>Hạn</th><th>Tiến độ</th><th>Trạng thái</th></tr>${L.map(t=>`<tr class="row" data-id="${t.id}" style="cursor:pointer"><td>${esc(t.t)}</td><td>${esc(t.dep)}</td><td>${esc(t.a)}</td><td>${PR[t.p]}</td><td class="${late(t)?"late":""}">${esc(t.due)||"—"}</td><td>${t.pg}%</td><td>${ST.find(s=>s[0]===t.s)[1]}</td></tr>`).join("")}</table></div>`}
else{const done=L.filter(t=>t.s==="done").length,lt=L.filter(late),avg=L.length?Math.round(L.reduce((a,t)=>a+t.pg,0)/L.length):0;
